[package]
name = "lingonberry-tray"
version = "0.1.0"
description = "Cross-OS menu bar and system tray app for Lingonberry Router (macOS, Linux, Windows)"
edition = "2021"

[lib]
name = "lingonberry_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tokio = { version = "1", features = ["time"] }
