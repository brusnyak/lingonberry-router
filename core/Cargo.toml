[package]
name = "lingonberry-core"
version = "0.1.0"
edition = "2021"
description = "Local cross-OS AI agent router, prompt cooker, key-slot pool, and loopback HTTP control plane"
license = "MIT"

[[bin]]
name = "lingonberry-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.32"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.11", features = ["v4"] }
which = "6.0"

[dev-dependencies]
tempfile = "3.13"
tower = "0.5"
