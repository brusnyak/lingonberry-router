<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingonberry Router</title>
    <meta
      name="description"
      content="Local AI agent router HTTP API for worker discovery, provider-scoped key leasing, routing receipts, and live snapshot monitoring."
    />
    <meta property="og:title" content="Lingonberry Router" />
    <meta
      property="og:description"
      content="Local AI agent router HTTP API for worker discovery, provider-scoped key leasing, routing receipts, and live snapshot monitoring."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/lingonberry-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lingonberry-theme') || 'system';
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-[#FAFAFA] text-zinc-950 dark:bg-[#09090B] dark:text-zinc-100 antialiased selection:bg-indigo-500/20"
  >
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
